<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rezeki Reboot — Laptop Second Bergaransi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#DCEAF5;
    --surface:#FBFDFA;
    --ink:#14201B;
    --muted:#5B6B62;
    --line:#C9DCEB;
    --neon-teal:#00A8A0;
    --neon-pink:#E8399F;
    --radius:14px;
    --shadow:0 4px 24px rgba(20,32,27,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  a{color:inherit;}

  /* ---------- HEADER ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px clamp(16px,4vw,48px);
    background:var(--surface);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;flex-direction:column;line-height:1;white-space:nowrap;}
  .brand .name{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(20px,3.4vw,32px);
    letter-spacing:0.5px;color:var(--ink);
    text-shadow:0 0 6px rgba(0,168,160,0.55),0 0 18px rgba(232,57,159,0.25);
    animation:flicker 2.4s ease-out 1;
  }
  .brand .tag{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
  @keyframes flicker{
    0%{opacity:0;text-shadow:none;}
    8%{opacity:1;}
    10%{opacity:0.2;}
    12%{opacity:1;}
    20%{opacity:0.4;}
    22%{opacity:1;text-shadow:0 0 6px rgba(0,168,160,0.55),0 0 18px rgba(232,57,159,0.25);}
    100%{opacity:1;}
  }
  nav a{margin-left:24px;font-size:14px;font-weight:600;text-decoration:none;color:var(--muted);}
  nav a:hover{color:var(--ink);}

  /* ---------- FILTER ---------- */
  .filters{
    display:flex;gap:10px;flex-wrap:wrap;
    padding:20px clamp(16px,4vw,48px) 4px;
  }
  .chip{
    padding:8px 16px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;
    transition:all .2s;color:var(--muted);
  }
  .chip.active,.chip:hover{
    border-color:var(--neon-teal);color:var(--ink);
    box-shadow:0 0 0 1px var(--neon-teal), 0 0 12px rgba(0,168,160,0.35);
  }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;gap:20px;padding:16px clamp(16px,4vw,48px) 60px;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  }
  .card{
    background:var(--surface);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;
    border:1px solid var(--line);
    transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-4px);}
  .photo-wrap{
    position:relative;aspect-ratio:4/3;overflow:hidden;background:#eef3ee;
    border-bottom:1px solid var(--line);
  }
  .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-wrap::after{
    content:"";position:absolute;inset:0;border-radius:0;
    box-shadow:inset 0 0 0 0 var(--neon-teal);
    transition:box-shadow .3s ease;pointer-events:none;
  }
  .card:hover .photo-wrap::after{
    box-shadow:inset 0 0 0 2px var(--neon-teal), 0 0 18px rgba(0,168,160,0.55);
  }
  .badge{
    position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;
    padding:4px 10px;border-radius:999px;background:rgba(20,32,27,0.85);color:#fff;
    letter-spacing:0.5px;
  }
  .badge.terjual{background:rgba(120,120,120,0.9);}
  .card.terjual .photo-wrap img{filter:grayscale(1);opacity:0.6;}
  .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .info .title{font-weight:600;font-size:15px;line-height:1.3;}
  .info .specs{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);}
  .info .price{
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:16px;
    color:var(--ink);margin-top:auto;
  }
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
  .tag-row span{
    font-size:10.5px;background:#EEF7F3;color:#1B6E5B;padding:3px 8px;border-radius:999px;font-weight:600;
  }

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,32,27,0.55);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--surface);border-radius:var(--radius);max-width:640px;width:100%;
    max-height:90vh;overflow-y:auto;position:relative;
  }
  .modal .close{position:absolute;top:12px;right:16px;font-size:22px;cursor:pointer;color:var(--muted);}
  .modal .photo-wrap{aspect-ratio:16/10;border-radius:var(--radius) var(--radius) 0 0;}
  .modal-body{padding:22px 24px 28px;}
  .modal-body h2{margin:0 0 4px;font-family:'Rajdhani',sans-serif;font-size:24px;}
  .modal-body .price{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:#1B6E5B;margin:6px 0 14px;}
  .spec-table{width:100%;border-collapse:collapse;margin-bottom:14px;}
  .spec-table td{padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--line);}
  .spec-table td:first-child{color:var(--muted);width:40%;}
  .saran-box{
    background:#F5FAF6;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    font-size:13.5px;line-height:1.5;margin-bottom:16px;
  }
  .saran-box b{color:#1B6E5B;}
  .wa-btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--neon-teal);color:#fff;
    padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;
  }

  /* ---------- CHATBOT ---------- */
  .chat-bubble{
    position:fixed;bottom:22px;right:22px;width:56px;height:56px;border-radius:50%;
    background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:24px;cursor:pointer;box-shadow:0 4px 20px rgba(20,32,27,0.3);z-index:40;
  }
  .chat-panel{
    position:fixed;bottom:90px;right:22px;width:min(320px,86vw);max-height:420px;
    background:var(--surface);border-radius:var(--radius);box-shadow:0 8px 32px rgba(20,32,27,0.2);
    display:none;flex-direction:column;overflow:hidden;z-index:40;border:1px solid var(--line);
  }
  .chat-panel.show{display:flex;}
  .chat-head{padding:14px 16px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;}
  .chat-body{padding:12px;overflow-y:auto;flex:1;}
  .faq-q{
    display:block;width:100%;text-align:left;background:#F5FAF6;border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:13px;cursor:pointer;color:var(--ink);
  }
  .faq-q:hover{border-color:var(--neon-teal);}
  .faq-a{
    background:#EEF7F3;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px;line-height:1.5;
  }
  .chat-foot{padding:10px 12px;border-top:1px solid var(--line);}
  .chat-foot a{font-size:12.5px;color:var(--neon-teal);font-weight:600;text-decoration:none;}

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--ink);color:#DCE7E1;padding:32px clamp(16px,4vw,48px);
    display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;
  }
  footer .social a{margin-right:14px;font-size:20px;text-decoration:none;}
  footer small{color:#8CA79B;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="name">REZEKI REBOOT</span>
    <span class="tag">Laptop Second Bergaransi</span>
  </div>
  <nav>
    <a href="#katalog">Katalog</a>
    <a href="#kontak">Kontak</a>
  </nav>
</header>

<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <span class="close" id="closeModal">&times;</span>
    <div id="modalContent"></div>
  </div>
</div>

<div class="chat-bubble" id="chatBubble">💬</div>
<div class="chat-panel" id="chatPanel">
  <div class="chat-head">Tanya Cepat</div>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-foot"><a id="waFallback" target="_blank">Belum ketemu jawabannya? Chat WA langsung →</a></div>
</div>

<footer id="kontak">
  <div>
    <div style="font-weight:600;margin-bottom:6px;">REZEKI REBOOT</div>
    <a id="waFooter" target="_blank" style="color:var(--neon-teal);font-weight:600;text-decoration:none;">Chat via WhatsApp</a>
  </div>
  <div class="social">
    <a href="#" title="Instagram">📷</a>
    <a href="#" title="TikTok">🎵</a>
  </div>
  <small>© 2026 REZEKI REBOOT — Semua laptop dicek & bergaransi.</small>
</footer>

<script>
/* ================= KONFIGURASI — GANTI BAGIAN INI ================= */
const API_URL   = 'https://script.google.com/macros/s/AKfycbxS41SGrAaAlPREqM5p_4NYrHSJj25i6uT6-VCaCnN2lsLdKbRWQz5lgoc8j5Yhs1o/exec'; // hasil deploy Code.gs
const WA_NUMBER = '6287831805802';                    // nomor WA format 62xxx tanpa +/spasi
/* ===================================================================== */

const waLink = (msg) => `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
document.getElementById('waFooter').href = waLink('Halo, saya mau tanya-tanya soal laptop second di REZEKI REBOOT');
document.getElementById('waFallback').href = waLink('Halo, saya mau tanya soal laptop second.');

const FAQ = [
  { q: 'Apakah laptopnya bergaransi?', a: 'Setiap unit sudah dicek fisik & fungsi sebelum dijual, dan diberi garansi toko. Detail masa garansi dikonfirmasi lewat WA sebelum transaksi.' },
  { q: 'Bisa COD atau cuma transfer?', a: 'Bisa keduanya — COD untuk area tertentu, atau transfer bank dengan konfirmasi via WA.' },
  { q: 'Boleh cek unit dulu sebelum bayar?', a: 'Boleh, silakan janjian waktu ketemu lewat WA supaya bisa dicek langsung sebelum deal.' },
  { q: 'Harga bisa nego?', a: 'Harga yang tertera sudah harga pas dengan margin tetap, tapi silakan tanya lewat WA kalau ada pertanyaan soal harga.' },
  { q: 'Ada laptop khusus desain/gaming ringan?', a: 'Ada — gunakan filter tag di atas katalog (Office / Desain / Gaming Ringan / Multimedia) untuk melihat rekomendasi sesuai kebutuhan.' }
];

let ALL_LAPTOPS = [];
let ACTIVE_TAG = 'Semua';

async function loadCatalog(){
  try{
    const res = await fetch(`${API_URL}?action=list`);
    const json = await res.json();
    if(json.ok){ ALL_LAPTOPS = json.data; renderFilters(); renderGrid(); }
    else document.getElementById('grid').innerHTML = '<p>Gagal memuat data.</p>';
  }catch(err){
    document.getElementById('grid').innerHTML = '<p>Gagal memuat data. Cek koneksi atau API_URL.</p>';
  }
}

function renderFilters(){
  const tagSet = new Set(['Semua']);
  ALL_LAPTOPS.forEach(l => l.tags.forEach(t => tagSet.add(t)));
  const box = document.getElementById('filters');
  box.innerHTML = [...tagSet].map(t =>
    `<div class="chip ${t===ACTIVE_TAG?'active':''}" data-tag="${t}">${t}</div>`
  ).join('');
  box.querySelectorAll('.chip').forEach(chip=>{
    chip.onclick = () => { ACTIVE_TAG = chip.dataset.tag; renderFilters(); renderGrid(); };
  });
}

function renderGrid(){
  const list = ACTIVE_TAG === 'Semua' ? ALL_LAPTOPS : ALL_LAPTOPS.filter(l => l.tags.includes(ACTIVE_TAG));
  const grid = document.getElementById('grid');
  if(list.length === 0){ grid.innerHTML = '<p>Belum ada laptop untuk kategori ini.</p>'; return; }
  grid.innerHTML = list.map((l, i) => `
    <div class="card ${l.status==='Terjual'?'terjual':''}" data-idx="${i}" data-tag="${ACTIVE_TAG}">
      <div class="photo-wrap">
        <img src="${l.foto || 'https://placehold.co/400x300?text=Foto+Belum+Ada'}" loading="lazy" alt="${l.merk} ${l.model}">
        <span class="badge ${l.status==='Terjual'?'terjual':''}">${l.status==='Terjual'?'Terjual':'Tersedia'}</span>
      </div>
      <div class="info">
        <div class="title">${l.merk} ${l.model}</div>
        <div class="specs">${l.prosesor} · ${l.ram} · ${l.storage}</div>
        <div class="tag-row">${l.tags.map(t=>`<span>${t}</span>`).join('')}</div>
        <div class="price">Rp ${Number(l.harga).toLocaleString('id-ID')}</div>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.card').forEach(card=>{
    card.onclick = () => openModal(list[Number(card.dataset.idx)]);
  });
}

function openModal(l){
  document.getElementById('modalContent').innerHTML = `
    <div class="photo-wrap"><img src="${l.foto || 'https://placehold.co/600x375?text=Foto+Belum+Ada'}" alt="${l.merk} ${l.model}"></div>
    <div class="modal-body">
      <h2>${l.merk} ${l.model} (${l.tahun})</h2>
      <div class="price">Rp ${Number(l.harga).toLocaleString('id-ID')}</div>
      <table class="spec-table">
        <tr><td>Prosesor</td><td>${l.prosesor}</td></tr>
        <tr><td>RAM</td><td>${l.ram}</td></tr>
        <tr><td>Storage</td><td>${l.storage}</td></tr>
        <tr><td>Layar</td><td>${l.layar}</td></tr>
        <tr><td>Baterai</td><td>${l.baterai}</td></tr>
        <tr><td>Kondisi Fisik</td><td>${l.kondisi}</td></tr>
      </table>
      <div class="saran-box"><b>Cocok untuk:</b> ${l.saran}</div>
      <a class="wa-btn" target="_blank" href="${waLink('Halo, saya tertarik dengan '+l.merk+' '+l.model+' ('+l.tahun+') yang harganya Rp '+Number(l.harga).toLocaleString('id-ID')+'.')}">💬 Tanya via WhatsApp</a>
    </div>`;
  document.getElementById('overlay').classList.add('show');
}
document.getElementById('closeModal').onclick = () => document.getElementById('overlay').classList.remove('show');
document.getElementById('overlay').onclick = (e) => { if(e.target.id==='overlay') e.currentTarget.classList.remove('show'); };

/* Chatbot FAQ */
const chatBody = document.getElementById('chatBody');
chatBody.innerHTML = FAQ.map((f,i)=>`<div class="faq-q" data-i="${i}">${f.q}</div>`).join('');
chatBody.querySelectorAll('.faq-q').forEach(el=>{
  el.onclick = () => {
    const i = el.dataset.i;
    if(el.nextElementSibling && el.nextElementSibling.classList.contains('faq-a')){
      el.nextElementSibling.remove(); return;
    }
    const ans = document.createElement('div');
    ans.className = 'faq-a';
    ans.textContent = FAQ[i].a;
    el.insertAdjacentElement('afterend', ans);
  };
});
document.getElementById('chatBubble').onclick = () => document.getElementById('chatPanel').classList.toggle('show');

loadCatalog();
</script>
</body>
</html>
