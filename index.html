<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduKit Laptop — Laptop Second Bergaransi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#DCEAF5;
    --surface:#FBFDFA;
    --ink:#14201B;
    --muted:#5B6B62;
    --line:#C9DCEB;
    --neon-teal:#00A8A0;
    --neon-pink:#E8399F;
    --radius:14px;
    --shadow:0 4px 24px rgba(20,32,27,0.08);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  a{color:inherit;}

  /* ---------- HEADER ---------- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px clamp(16px,4vw,48px);
    background:var(--surface);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;flex-direction:column;line-height:1;white-space:nowrap;}
  .brand .name{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(20px,3.4vw,32px);
    letter-spacing:0.5px;color:var(--ink);
    text-shadow:0 0 6px rgba(0,168,160,0.55),0 0 18px rgba(232,57,159,0.25);
    animation:flicker 2.4s ease-out 1;
  }
  .brand .tag{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:2px;}
  @keyframes flicker{
    0%{opacity:0;text-shadow:none;}
    8%{opacity:1;}
    10%{opacity:0.2;}
    12%{opacity:1;}
    20%{opacity:0.4;}
    22%{opacity:1;text-shadow:0 0 6px rgba(0,168,160,0.55),0 0 18px rgba(232,57,159,0.25);}
    100%{opacity:1;}
  }
  nav a{margin-left:24px;font-size:14px;font-weight:600;text-decoration:none;color:var(--muted);}
  nav a:hover{color:var(--ink);}

  /* ---------- NEWSFLASH ---------- */
  .newsflash-wrap{ padding:22px 0 8px; }
  .newsflash{
    display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;
    padding:10px clamp(16px,4vw,48px) 18px;scroll-behavior:smooth;
    user-select:none;
  }
  .newsflash::-webkit-scrollbar{ display:none; }
  .news-card{
    flex:0 0 clamp(220px,78vw,300px);scroll-snap-align:center;
    background:var(--surface);border-radius:18px;padding:22px 22px 20px;
    border:1px solid var(--line);box-shadow:0 8px 20px rgba(20,32,27,0.08);
    transition:transform .35s ease,opacity .35s ease,box-shadow .35s ease;
    opacity:0.45;transform:scale(0.88);
  }
  .news-card.active{
    opacity:1;transform:scale(1);
    box-shadow:0 16px 34px rgba(20,32,27,0.16);
  }
  .news-card .icon{ font-size:26px;line-height:1;margin-bottom:10px; }
  .news-card .tag{
    font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--neon-teal);font-weight:700;margin-bottom:6px;
  }
  .news-card h4{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:19px;
    margin:0 0 8px;line-height:1.25;color:var(--ink);
  }
  .news-card p{ font-size:13px;color:var(--muted);line-height:1.55;margin:0; }
  .newsflash-dots{
    display:flex;gap:6px;justify-content:center;padding-bottom:4px;
  }
  .newsflash-dots span{
    width:6px;height:6px;border-radius:50%;background:var(--line);
    transition:background .3s ease,width .3s ease;
  }
  .newsflash-dots span.active{ background:var(--neon-teal);width:18px;border-radius:4px; }

  /* ---------- SEARCH ---------- */
  .search-wrap{ padding:4px clamp(16px,4vw,48px) 0; }
  #searchBox{
    width:100%;padding:11px 16px;border-radius:10px;border:1px solid var(--line);
    background:var(--surface);font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);
  }
  #searchBox:focus{ outline:none;border-color:var(--neon-teal);box-shadow:0 0 0 3px rgba(0,168,160,0.15); }

  /* ---------- FILTER ---------- */
  .filter-wrap{ padding:14px clamp(16px,4vw,48px) 10px; }
  .filter-top{ display:flex;gap:8px;flex-wrap:wrap;align-items:center; }
  .chip{
    flex:0 0 auto;white-space:nowrap;
    padding:8px 16px;border-radius:999px;border:1px solid var(--line);
    background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;
    transition:all .2s;color:var(--muted);
  }
  .chip.active,.chip:hover{
    border-color:var(--neon-teal);color:var(--ink);
    box-shadow:0 0 0 1px var(--neon-teal), 0 0 12px rgba(0,168,160,0.35);
  }
  .chip-more{
    padding:8px 16px;border-radius:999px;border:1px dashed var(--muted);
    background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);
  }
  .chip-more:hover{ border-color:var(--neon-teal);color:var(--neon-teal); }
  .filter-more{
    display:none;flex-wrap:wrap;gap:8px;margin-top:10px;padding:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
  }
  .filter-more.open{ display:flex; }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;gap:20px;padding:16px clamp(16px,4vw,48px) 60px;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  }
  .card{
    background:var(--surface);border-radius:var(--radius);overflow:hidden;
    box-shadow:var(--shadow);cursor:pointer;
    border:1px solid var(--line);
    transition:transform .25s ease;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-4px);}
  .photo-wrap{
    position:relative;aspect-ratio:4/3;overflow:hidden;background:#eef3ee;
    border-bottom:1px solid var(--line);
  }
  .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-wrap::after{
    content:"";position:absolute;inset:0;border-radius:0;
    box-shadow:inset 0 0 0 0 var(--neon-teal);
    transition:box-shadow .3s ease;pointer-events:none;
  }
  .card:hover .photo-wrap::after{
    box-shadow:inset 0 0 0 2px var(--neon-teal), 0 0 18px rgba(0,168,160,0.55);
  }
  .badge{
    position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;
    padding:4px 10px;border-radius:999px;background:rgba(20,32,27,0.85);color:#fff;
    letter-spacing:0.5px;
  }
  .badge.terjual{background:rgba(120,120,120,0.9);}
  .card.terjual .photo-wrap img{filter:grayscale(1);opacity:0.6;}
  .info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .info .title{font-weight:600;font-size:15px;line-height:1.3;}
  .info .specs{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);}
  .info .price{
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:16px;
    color:var(--ink);margin-top:auto;
  }
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;max-height:44px;overflow:hidden;}
  .tag-row span.more{ background:#EFEFEC;color:var(--muted); }
  .tag-row span{
    font-size:10.5px;background:#EEF7F3;color:#1B6E5B;padding:3px 8px;border-radius:999px;font-weight:600;
  }

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,32,27,0.55);
    display:none;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--surface);border-radius:var(--radius);max-width:640px;width:100%;
    max-height:90vh;overflow-y:auto;position:relative;
  }
  .modal .close{position:absolute;top:12px;right:16px;font-size:22px;cursor:pointer;color:var(--muted);}
  .modal .photo-wrap{aspect-ratio:16/10;border-radius:var(--radius) var(--radius) 0 0;}
  .modal-body{padding:22px 24px 28px;}
  .modal-body h2{margin:0 0 4px;font-family:'Rajdhani',sans-serif;font-size:24px;}
  .modal-body .price{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;color:#1B6E5B;margin:6px 0 14px;}
  .spec-table{width:100%;border-collapse:collapse;margin-bottom:14px;}
  .spec-table td{padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--line);}
  .spec-table td:first-child{color:var(--muted);width:40%;}
  .saran-box{
    background:#F5FAF6;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    font-size:13.5px;line-height:1.5;margin-bottom:16px;
  }
  .saran-box b{color:#1B6E5B;}
  .wa-btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--neon-teal);color:#fff;
    padding:12px 20px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px;
  }

  /* ---------- CHATBOT ---------- */
  .chat-bubble{
    position:fixed;bottom:22px;right:22px;width:56px;height:56px;border-radius:50%;
    background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:24px;cursor:pointer;box-shadow:0 4px 20px rgba(20,32,27,0.3);z-index:40;
  }
  .chat-panel{
    position:fixed;bottom:90px;right:22px;width:min(320px,86vw);max-height:420px;
    background:var(--surface);border-radius:var(--radius);box-shadow:0 8px 32px rgba(20,32,27,0.2);
    display:none;flex-direction:column;overflow:hidden;z-index:40;border:1px solid var(--line);
  }
  .chat-panel.show{display:flex;}
  .chat-head{padding:14px 16px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;}
  .chat-body{padding:12px;overflow-y:auto;flex:1;}
  .faq-q{
    display:block;width:100%;text-align:left;background:#F5FAF6;border:1px solid var(--line);
    border-radius:8px;padding:9px 12px;margin-bottom:8px;font-size:13px;cursor:pointer;color:var(--ink);
  }
  .faq-q:hover{border-color:var(--neon-teal);}
  .faq-a{
    background:#EEF7F3;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:10px;line-height:1.5;
  }
  .chat-foot{padding:10px 12px;border-top:1px solid var(--line);}
  .chat-foot a{font-size:12.5px;color:var(--neon-teal);font-weight:600;text-decoration:none;}

  /* ---------- FOOTER ---------- */
  footer{
    background:var(--ink);color:#DCE7E1;padding:32px clamp(16px,4vw,48px);
    display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;
  }
  footer .social a{margin-right:14px;color:#DCE7E1;display:inline-flex;align-items:center;text-decoration:none;}
  footer .social a:hover{color:var(--neon-teal);}
  footer small{color:#8CA79B;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="name">EDUKIT LAPTOP</span>
    <span class="tag">Laptop Second Bergaransi</span>
  </div>
  <nav>
    <a href="#katalog">Katalog</a>
    <a href="#kontak">Kontak</a>
  </nav>
</header>

<div class="newsflash-wrap">
  <div class="newsflash" id="newsflash"></div>
  <div class="newsflash-dots" id="newsflashDots"></div>
</div>

<div class="search-wrap">
  <input type="text" id="searchBox" placeholder="Cari merk, model, atau prosesor...">

<div class="filter-wrap">
  <div class="filter-top" id="filterTop"></div>

</div>
<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">

</div>

<div class="chat-bubble" id="chatBubble">💬</div>

  <div class="chat-body" id="chatBody"></div>

</div>

<footer id="kontak">
  <div>
    <div style="font-weight:600;margin-bottom:6px;">EDUKIT LAPTOP</div>
    <a id="waFooter" target="_blank" style="color:var(--neon-teal);font-weight:600;text-decoration:none;">Chat via WhatsApp</a>
  </div>
  <div class="social">
    <a href="#" title="Instagram" aria-label="Instagram">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
    </a>
    <a href="#" title="TikTok" aria-label="TikTok">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 2h-3v13.2c0 1.4-1.1 2.5-2.5 2.5s-2.5-1.1-2.5-2.5 1.1-2.5 2.5-2.5c.2 0 .5 0 .7.1v-3.1c-.2 0-.5 0-.7 0-3 0-5.5 2.5-5.5 5.5s2.5 5.5 5.5 5.5 5.5-2.5 5.5-5.5V8.6c1 .7 2.3 1.1 3.5 1.1V6.7c-2 0-3.5-1.6-3.5-3.6V2z"/></svg>
    </a>
  </div>
  <small>© 2026 EDUKIT LAPTOP — Semua laptop dicek & bergaransi.</small>
</footer>

<script>
/* ================= KONFIGURASI — GANTI BAGIAN INI ================= */
const API_URL   = 'https://script.google.com/macros/s/AKfycbxS41SGrAaAlPREqM5p_4NYrHSJj25i6uT6-VCaCnN2lsLdKbRWQz5lgoc8j5Yhs1o/exec'; // hasil deploy Code.gs
const WA_NUMBER = '6285151981896';                    // nomor WA format 62xxx tanpa +/spasi
/* ===================================================================== */

const waLink = (msg) => `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
document.getElementById('waFooter').href = waLink('Halo, saya mau tanya-tanya soal laptop second di EDUKIT LAPTOP');
document.getElementById('waFallback').href = waLink('Halo, saya mau tanya soal laptop second.');

const FAQ = [
  { q: 'Apakah laptopnya bergaransi?', a: 'Setiap unit sudah dicek fisik & fungsi sebelum dijual, dan diberi garansi toko. Detail masa garansi dikonfirmasi lewat WA sebelum transaksi.' },
  { q: 'Bisa COD atau cuma transfer?', a: 'Bisa keduanya — COD untuk area tertentu, atau transfer bank dengan konfirmasi via WA.' },
  { q: 'Boleh cek unit dulu sebelum bayar?', a: 'Boleh, silakan janjian waktu ketemu lewat WA supaya bisa dicek langsung sebelum deal.' },
  { q: 'Harga bisa nego?', a: 'Harga yang tertera sudah harga pas dengan margin tetap, tapi silakan tanya lewat WA kalau ada pertanyaan soal harga.' },
  { q: 'Ada laptop khusus desain/gaming ringan?', a: 'Ada — gunakan filter tag di atas katalog (Office / Desain / Gaming Ringan / Multimedia) untuk melihat rekomendasi sesuai kebutuhan.' },
  { q: 'Bisa buat edit video (CapCut)?', a: 'Disarankan pilih unit dengan prosesor Core i3 atau i5 (bukan Celeron/AMD entry-level) untuk edit video. Kalau RAM unit yang diminati masih 4GB, bisa tanya opsi upgrade RAM ke 8GB dulu ke kami — bakal jauh lebih nyaman buat CapCut.' }
];

const NEWSFLASH = [
  { icon: '💡', tag: 'Tips', title: 'Cek Generasi Prosesor', text: 'Angka setelah i3/i5/i7 itu generasi. Makin besar makin baru & makin ngebut.' },
  { icon: '⚡', tag: 'Fakta', title: 'i5 Baru vs i7 Lama', text: 'i5 generasi baru bisa ngungguli i7 generasi lama. Generasi lebih penting dari tier.' },
  { icon: '🎮', tag: 'Gaming', title: 'GPU Itu Kunci', text: 'Buat gaming wajib ada GPU terpisah (GTX/RTX) — bukan cuma grafis bawaan Intel.' },
  { icon: '🔋', tag: 'Realistis', title: 'Baterai Unit Second', text: 'Wajar di kisaran 1,5–2,5 jam. Unit istimewa bisa sampai 4 jam.' },
  { icon: '🔌', tag: 'Perawatan', title: 'Waktu Ideal Nge-charge', text: 'Charge saat baterai tersisa ~30%, jangan tunggu sampai benar-benar habis. Ini bantu jaga kesehatan & memperpanjang umur pakai baterainya.' },
  { icon: '🛡️', tag: 'Jaminan', title: 'Dicek Sebelum Naik', text: 'Tiap unit dicek fisik & fungsi dulu sebelum ditampilkan ke kamu.' },
  { icon: '🤝', tag: 'Transaksi', title: 'Boleh Cek Dulu', text: 'Nggak asal transfer — boleh ketemu & cek unit langsung sebelum deal.' }
];

document.getElementById('newsflash').innerHTML = NEWSFLASH.map((n, i) => `
  <div class="news-card" data-i="${i}">
    <div class="icon">${n.icon}</div>
    <div class="tag">${n.tag}</div>
    <h4>${n.title}</h4>
    <p>${n.text}</p>
  </div>
`).join('');
document.getElementById('newsflashDots').innerHTML = NEWSFLASH.map((_, i) =>
  `<span data-i="${i}"></span>`
).join('');

const newsCards = [...document.querySelectorAll('.news-card')];
const newsDots = [...document.querySelectorAll('.newsflash-dots span')];
const newsObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    const i = entry.target.dataset.i;
    if (entry.intersectionRatio > 0.6) {
      entry.target.classList.add('active');
      newsDots.forEach(d => d.classList.toggle('active', d.dataset.i === i));
    } else {
      entry.target.classList.remove('active');
    }
  });
}, { root: document.getElementById('newsflash'), threshold: [0, 0.6, 1] });
newsCards.forEach(c => newsObserver.observe(c));

/* Drag-to-scroll pakai mouse (buat desktop, biar setara sama swipe di HP) */
function enableDragScroll(track){
  let isDown = false, startX = 0, startScroll = 0, moved = false;
  track.style.cursor = 'grab';
  track.addEventListener('mousedown', (e) => {
    isDown = true; moved = false;
    startX = e.pageX; startScroll = track.scrollLeft;
    track.style.cursor = 'grabbing';
  });
  window.addEventListener('mouseup', () => {
    isDown = false; track.style.cursor = 'grab';
  });
  window.addEventListener('mousemove', (e) => {
    if (!isDown) return;
    e.preventDefault();
    const dx = e.pageX - startX;
    if (Math.abs(dx) > 4) moved = true;
    track.scrollLeft = startScroll - dx;
  });
  track.addEventListener('click', (e) => { if (moved) { e.preventDefault(); e.stopPropagation(); } }, true);
}
enableDragScroll(document.getElementById('newsflash'));

let ALL_LAPTOPS = [];
let ACTIVE_TAG = 'Semua';
let SEARCH_QUERY = '';

async function loadCatalog(){
  try{
    const res = await fetch(`${API_URL}?action=list`);
    const json = await res.json();
    if(json.ok){ ALL_LAPTOPS = json.data; renderFilters(); renderGrid(); }
    else document.getElementById('grid').innerHTML = '<p>Gagal memuat data.</p>';
  }catch(err){
    document.getElementById('grid').innerHTML = '<p>Gagal memuat data. Cek koneksi atau API_URL.</p>';
  }
}

const POPULAR_LIMIT = 5; // jumlah tag populer yang tampil langsung, sisanya di balik "Filter lainnya"

function renderFilters(){
  const freq = {};
  ALL_LAPTOPS.forEach(l => l.tags.forEach(t => { freq[t] = (freq[t]||0) + 1; }));
  const sorted = Object.keys(freq).sort((a,b) => freq[b]-freq[a]);
  const popular = sorted.slice(0, POPULAR_LIMIT);
  const rest = sorted.slice(POPULAR_LIMIT);

  const chipHtml = (t) => `<button class="chip ${t===ACTIVE_TAG?'active':''}" data-tag="${t}">${t}</button>`;

  const top = document.getElementById('filterTop');
  top.innerHTML = `<button class="chip ${ACTIVE_TAG==='Semua'?'active':''}" data-tag="Semua">Semua</button>`
    + popular.map(chipHtml).join('')
    + (rest.length ? `<button class="chip-more" id="moreBtn">Filter lainnya (${rest.length}) ▾</button>` : '');

  const moreBox = document.getElementById('filterMore');
  moreBox.innerHTML = rest.map(chipHtml).join('');

  [...top.querySelectorAll('.chip'), ...moreBox.querySelectorAll('.chip')].forEach(chip=>{
    chip.onclick = () => { ACTIVE_TAG = chip.dataset.tag; renderFilters(); renderGrid(); };
  });

  const moreBtn = document.getElementById('moreBtn');
  if(moreBtn){
    moreBtn.onclick = () => {
      moreBox.classList.toggle('open');
      moreBtn.textContent = moreBox.classList.contains('open')
        ? `Filter lainnya (${rest.length}) ▴` : `Filter lainnya (${rest.length}) ▾`;
    };
  }
}

document.getElementById('searchBox').addEventListener('input', (e) => {
  SEARCH_QUERY = e.target.value;
  renderGrid();
});

function renderGrid(){
  const q = SEARCH_QUERY.trim().toLowerCase();
  const list = ALL_LAPTOPS.filter(l => {
    const tagMatch = ACTIVE_TAG === 'Semua' || l.tags.includes(ACTIVE_TAG);
    const searchMatch = !q || `${l.merk} ${l.model} ${l.prosesor}`.toLowerCase().includes(q);
    return tagMatch && searchMatch;
  });
  const grid = document.getElementById('grid');
  if(list.length === 0){ grid.innerHTML = '<p>Belum ada laptop yang cocok. Coba kata kunci atau filter lain.</p>'; return; }
  grid.innerHTML = list.map((l, i) => `
    <div class="card ${l.status==='Terjual'?'terjual':''}" data-idx="${i}" data-tag="${ACTIVE_TAG}">
      <div class="photo-wrap">
        <img src="${l.foto || 'https://placehold.co/400x300?text=Foto+Belum+Ada'}" loading="lazy" alt="${l.merk} ${l.model}">
        <span class="badge ${l.status==='Terjual'?'terjual':''}">${l.status==='Terjual'?'Terjual':'Tersedia'}</span>
      </div>
      <div class="info">
        <div class="title">${l.merk} ${l.model}</div>
        <div class="specs">${l.prosesor} · ${l.ram} · ${l.storage}${l.gpu ? ' · '+l.gpu : ''}</div>
        <div class="tag-row">${l.tags.slice(0,3).map(t=>`<span>${t}</span>`).join('')}${l.tags.length>3?`<span class="more">+${l.tags.length-3}</span>`:''}</div>
        <div class="price">Rp ${Number(l.harga).toLocaleString('id-ID')}</div>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.card').forEach(card=>{
    card.onclick = () => openModal(list[Number(card.dataset.idx)]);
  });
}

function openModal(l){
  document.getElementById('modalContent').innerHTML = `
    <div class="photo-wrap"><img src="${l.foto || 'https://placehold.co/600x375?text=Foto+Belum+Ada'}" alt="${l.merk} ${l.model}"></div>
    <div class="modal-body">
      <h2>${l.merk} ${l.model} (${l.tahun})</h2>
      <div class="price">Rp ${Number(l.harga).toLocaleString('id-ID')}</div>
      <table class="spec-table">
        <tr><td>Prosesor</td><td>${l.prosesor}</td></tr>
        ${l.gpu ? `<tr><td>GPU</td><td>${l.gpu}</td></tr>` : ''}
        <tr><td>RAM</td><td>${l.ram}</td></tr>
        <tr><td>Storage</td><td>${l.storage}</td></tr>
        <tr><td>Layar</td><td>${l.layar}</td></tr>
        <tr><td>Baterai</td><td>${l.baterai}</td></tr>
        <tr><td>Kondisi Fisik</td><td>${l.kondisi}</td></tr>
      </table>
      <div class="saran-box"><b>Cocok untuk:</b> ${l.saran}</div>
      <a class="wa-btn" target="_blank" href="${waLink('Halo, saya tertarik dengan '+l.merk+' '+l.model+' ('+l.tahun+') yang harganya Rp '+Number(l.harga).toLocaleString('id-ID')+'.')}">💬 Tanya via WhatsApp</a>
    </div>`;
  document.getElementById('overlay').classList.add('show');
}
document.getElementById('closeModal').onclick = () => document.getElementById('overlay').classList.remove('show');
document.getElementById('overlay').onclick = (e) => { if(e.target.id==='overlay') e.currentTarget.classList.remove('show'); };

/* Chatbot FAQ */
const chatBody = document.getElementById('chatBody');
chatBody.innerHTML = FAQ.map((f,i)=>`<div class="faq-q" data-i="${i}">${f.q}</div>`).join('');
chatBody.querySelectorAll('.faq-q').forEach(el=>{
  el.onclick = () => {
    const i = el.dataset.i;
    if(el.nextElementSibling && el.nextElementSibling.classList.contains('faq-a')){
      el.nextElementSibling.remove(); return;
    }
    const ans = document.createElement('div');
    ans.className = 'faq-a';
    ans.textContent = FAQ[i].a;
    el.insertAdjacentElement('afterend', ans);
  };
});
document.getElementById('chatBubble').onclick = () => document.getElementById('chatPanel').classList.toggle('show');

loadCatalog();
</script>
</body>
</html>
